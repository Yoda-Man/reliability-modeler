services:
  api:
    image: trustaldo/reliability-modeler-api:latest
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=http://localhost:3000
      # Shared secret for API auth. Set the same value in the ui service.
      - RELIABILITY_API_KEY=${RELIABILITY_API_KEY:-}
      # Sentry integration
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
      - SENTRY_BASE_URL=${SENTRY_BASE_URL:-https://sentry.io/api/0/}
    volumes:
      # Persist log archives, analyses, and plots across restarts
      - output_data:/app/output

  ui:
    image: trustaldo/reliability-modeler-ui:latest
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      # Server-side API URL used by the Next.js proxy (not exposed to the browser)
      - API_URL=http://api:8000
      # Must match the API's RELIABILITY_API_KEY
      - RELIABILITY_API_KEY=${RELIABILITY_API_KEY:-}

volumes:
  output_data:
