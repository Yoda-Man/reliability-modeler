name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"   # must match the API image (python:3.13-slim)
  NODE_VERSION: "22"       # must match the UI image (node:22-alpine)

jobs:
  python-unit:
    name: Python unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            web/api/requirements*

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f web/api/requirements.lock ]; then pip install -r web/api/requirements.lock; else pip install -r web/api/requirements.txt; fi
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m pytest tests --ignore=tests/integration \
            --cov=modeler --cov=web/api \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=75

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: python-unit
    env:
      RELIABILITY_API_KEY: ci-integration-key-not-secret
      RELIABILITY_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            web/api/requirements*

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f web/api/requirements.lock ]; then pip install -r web/api/requirements.lock; else pip install -r web/api/requirements.txt; fi
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Start API server
        run: |
          mkdir -p "$RUNNER_TEMP/rm-output" "$RUNNER_TEMP/rm-config"
          cd web/api
          OUTPUT_DIR="$RUNNER_TEMP/rm-output" CONFIG_DIR="$RUNNER_TEMP/rm-config" \
            nohup uvicorn main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then
              echo "API is live"; curl -s http://127.0.0.1:8000/health; echo; exit 0
            fi
            sleep 1
          done
          echo "API did not become live within 60s"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Run integration tests
        run: python -m pytest tests/integration -v --tb=short

      - name: API log
        if: always()
        run: cat "$RUNNER_TEMP/api.log" || true

  ui:
    name: UI lint, typecheck, test, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit API runtime requirements
        run: |
          if [ -f web/api/requirements.lock ]; then REQ=web/api/requirements.lock; else REQ=web/api/requirements.txt; fi
          pip-audit --strict -r "$REQ"

      - name: Audit engine requirements
        run: pip-audit --strict -r requirements.txt

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [python-unit, ui]
    env:
      IMAGE_TAG: ci-${{ github.run_id }}
      DOCKERHUB_NAMESPACE: ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/api/Dockerfile
          load: true
          tags: ci/reliability-modeler-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: web/ui
          file: web/ui/Dockerfile
          load: true
          tags: ci/reliability-modeler-ui:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

      - name: Smoke test
        run: ./scripts/smoke-test.sh
